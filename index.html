<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Books">
<title>Books</title>
<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --ink: #1d1b16; --muted: #6f6a5f; --line: #e3dfd5;
  --accent: #2f5d50; --accent-ink: #ffffff; --warn: #9a3b2e; --chip: #ece8de; --bar: #d9d3c4; --ij: #b0466e; --ij-ink: #ffffff; --o51: #56606e; --o51-ink: #ffffff;
  --c-fv: #2d5b8a; --c-rs: #2f5d50; --c-stars: #a26a12; --c-exc: #6b4fa0; --champ-ink: #ffffff;
  --h1: #7fb069; --h2: #c9b23a; --h3: #e08a2e; --h4: #cc4b2c; --h5: #8e1f3a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15140f; --card: #1f1e18; --ink: #ece8de; --muted: #9c968a; --line: #34322a;
    --accent: #7fb8a6; --accent-ink: #10201b; --warn: #e08b7c; --chip: #2b2a23; --bar: #3a382f; --ij: #e58fb1; --ij-ink: #2a0d18; --o51: #b4bfcc; --o51-ink: #15140f;
    --c-fv: #8fb6e0; --c-rs: #7fb8a6; --c-stars: #e3b35c; --c-exc: #b9a3e8; --champ-ink: #15140f;
    --h1: #8cc47a; --h2: #e0c84a; --h3: #f0a04a; --h4: #ec6a4c; --h5: #d0486a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding: 0 16px calc(84px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
h1 { font-size: 22px; margin: 18px 0 4px; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 10px 0; }
.title { font-weight: 650; font-size: 18px; line-height: 1.25; }
.by { color: var(--muted); font-size: 14px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip.ij, .ijm { background: var(--ij); color: var(--ij-ink); font-weight: 700; }
.chip.o51, .ijm.o51 { background: var(--o51); color: var(--o51-ink); }
.ijm { font-size: 10px; border-radius: 999px; padding: 1px 6px; margin-right: 6px; vertical-align: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 12px; }
.stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.bar { height: 6px; background: var(--bar); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.row { display: flex; gap: 8px; margin-top: 12px; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 10px; padding: 10px 14px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.grow { flex: 1; }
button:disabled { opacity: .5; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { border: 0; border-radius: 0; flex: 1; max-width: 213px; padding: 14px 0 16px; color: var(--muted); background: none; }
nav button.on { color: var(--accent); font-weight: 650; }
.seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; margin: 12px 0; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 0; font-size: 14px; border-radius: 8px; }
.seg button.on { background: var(--card); font-weight: 600; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.li { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.li:first-child { border-top: 0; }
.li .n { width: 24px; color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.li .t { flex: 1; min-width: 0; }
.li .t div:first-child { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t div:last-child { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li { position: relative; }
.li .hl { position: absolute; left: 48px; bottom: 0; height: 3px; border-radius: 2px; }
.li .hrs { font-weight: 650; }
.li .v { font-weight: 650; font-variant-numeric: tabular-nums; }
input[type=search], input[type=number] { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
.big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.stars { color: #c99a2e; letter-spacing: 2px; }
.flip { min-height: 300px; }
.flip .title { font-size: 24px; }
.notes { font-size: 13px; color: var(--muted); margin-top: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: var(--ink); color: var(--bg);
  padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: 90vw; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
label { font-size: 13px; color: var(--muted); display: block; margin: 14px 0 6px; }
.hist { font-size: 13px; color: var(--muted); margin-top: 8px; }
.cards { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 12px; }
.cards .card { margin: 0; display: flex; flex-direction: column; padding: 12px 14px; }
.hc .title { cursor: pointer; }
.ctls label { margin: 10px 0 4px; }
.ctls .bar { margin-top: 6px; height: 4px; }
.hc .ctls { display: flex; flex-direction: column; flex: 1; }
.ctls .fin { margin-top: auto; padding-top: 12px; }
.li.open { background: var(--chip); }
.topbar { display: flex; justify-content: flex-end; padding-top: 12px; margin-bottom: -6px; }
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; font-size: 14px; color: var(--ink); }
.sw input { position: absolute; opacity: 0; pointer-events: none; }
.sw .knob { width: 36px; height: 20px; border-radius: 999px; background: var(--bar); position: relative; transition: background .15s; flex: none; }
.sw .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw.on .knob { background: var(--accent); }
.sw.on .knob::after { left: 18px; }
.seg.have { margin: 0; }
.seg.have button { font-size: 13px; padding: 5px 0; }
.hc .seg.have button.on { color: var(--k); }
.li-x { padding: 4px 14px 14px; border-top: 1px solid var(--line); background: var(--card); }
.inl { display: flex; align-items: center; gap: 10px; }
.inl input[type=number] { width: 90px; padding: 6px 10px; }
.inl input.ed { width: 76px; }
.inl.edr { margin-top: 6px; font-size: 13px; color: var(--muted); }
.inl.edr input { width: 64px; padding: 4px 8px; font-size: 14px; }
.pct { margin-left: auto; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.inl b { min-width: 22px; text-align: center; font-size: 18px; }
button.sm { padding: 4px 12px; }
input.unset { opacity: .45; }
body.wide { max-width: 1600px; }
/* the four champions: Finish Value blue, Reading Score green, Pred Stars amber, Excitement purple */
.k-fv { --k: var(--c-fv); } .k-rs { --k: var(--c-rs); } .k-stars { --k: var(--c-stars); } .k-exc { --k: var(--c-exc); }
.hc { overflow: hidden; }
.stripe { display: flex; height: 6px; margin: -12px -14px 10px; }
.stripe i { flex: 1; background: var(--k); }
.chip.champ { background: var(--k); color: var(--champ-ink); font-weight: 600; }
.stat.k-fv b, .stat.k-rs b, .stat.k-stars b, .excv.k-exc { color: var(--k); }
.hc input[type=range] { accent-color: var(--k); }
.hc .bar i { background: var(--k); }
@media (min-width: 760px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1180px) { .cards { grid-template-columns: repeat(var(--n, 4), 1fr); } }
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<nav>
  <button data-tab="home" class="on">Home</button>
  <button data-tab="flip">Flip</button>
  <button data-tab="lists">Lists</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
const WORDS_PER_PAGE = 320;
const P0 = 0.1;   // weight of the model vs your rating-so-far: after 10% of the book they count equally

function starMult(s) { return s >= 3 ? Math.pow(2, 3 - s) : Math.pow(2, (3 - s) / 2); }

/** b: Books v2 row; st: App State row or undefined; myRating: latest Ratings value or null */
function score(b, st, myRating) {
  const n = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  st = st || {};
  const status = st.Status || '';
  const exc = n(st.Excitement) ?? n(b.excitement) ?? 1;
  const pages = Math.max(1, n(b.pages) ?? 1);
  const words = n(b.words) ?? pages * 300;
  const pagesRead = Math.min(pages, n(st['Pages Read']) ?? n(b.pagesRead) ?? 0);
  const reread = Math.min(1, Math.max(0, n(st['Reread %']) ?? n(b.reread) ?? 0));
  const model = n(b.modelStars) ?? 3;
  const mine = myRating ?? n(b.myRating);
  const fv = (n(b.fvFull) ?? 0) * (1 - reread);
  const base = mine !== null ? reread * mine + (1 - reread) * model : model;
  const sofar = status !== 'finished' ? n(st['Rating So Far']) : null;   // any unfinished book you've rated so far
  const p = pagesRead / pages;
  const cur = sofar ?? mine;
  const stars = cur !== null ? (p * cur + P0 * base) / (p + P0) : base;
  const eq = Math.max(0.05, words / WORDS_PER_PAGE * (pagesRead > 0 ? Math.pow(1 - pagesRead / pages, 3) : 1));
  const diff = n(b.difficulty) ?? 1;
  const rs = fv / (diff * starMult(stars)) / Math.sqrt(eq) * Math.pow(exc + 3, 2) / 10;
  return { exc, pages, pagesRead, fv, base, sofar, stars, diff, rs, status, mine, model, reread };
}

function hoursLeft(b) {
  const s = b.s, words = Number(b.words) || s.pages * 300;
  return Math.max(0, words * (1 - s.pagesRead / s.pages) * (s.diff || 1) / 250 / 60);
}
function hoursUI(b) {
  const h = hoursLeft(b), k = h < 2 ? 1 : h < 6 ? 2 : h < 15 ? 3 : h < 40 ? 4 : 5;
  const w = Math.max(4, Math.min(100, Math.log(Math.max(h, 0.5) / 0.5) / Math.log(200) * 100));
  const txt = h < 1 ? Math.max(1, Math.round(h * 60)) + 'm' : h < 10 ? h.toFixed(1).replace(/\.0$/, '') + 'h' : Math.round(h) + 'h';
  return { bar: `<i class="hl" style="width:calc((100% - 62px) * ${(w / 100).toFixed(3)});background:var(--h${k})"></i>`,
           txt: `<span class="hrs">${txt} left</span>` };
}

function edition(b, st) {
  st = st || S.state[b.id] || {};
  const n = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  const canon = b.s.pages;
  const bp = n(st['Book Pages']) > 0 ? n(st['Book Pages']) : canon;
  const ign = Math.min(Math.max(0, n(st['Ignore Pages']) ?? 0), bp - 1);
  const pr = b.s.pagesRead;   // a row from before Page existed: Pages Read was the page number
  const page = n(st.Page) ?? (pr > 0 ? Math.round(ign + pr / canon * (bp - ign)) : 0);
  return { canon, bp, ign, page, own: n(st['Book Pages']) > 0 };
}
const pagesReadFor = (e, page) => Math.round(Math.max(0, Math.min(1, (page - e.ign) / (e.bp - e.ign))) * e.canon * 100) / 100;

const S = { books: [], byId: {}, state: {}, ratings: {}, rhist: {}, rebuilt: '', tab: 'home', list: 'rs', q: '',
            flip: null };
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = x => (x ?? 0).toFixed(1), f2 = x => (x ?? 0).toFixed(2);
const fmtRS = x => x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
const starStr = r => r == null ? '' : '★'.repeat(Math.floor(r)) + (r % 1 >= .75 ? '¾' : r % 1 >= .5 ? '½' : r % 1 >= .25 ? '¼' : '');

const API = 'https://script.google.com/macros/s/AKfycbx76qcmuw2exHpvTWO8HTTMtoPkNMTptSQCvWlckfZSeuFSkVRgypJaalTvYXSy4WyPdg/exec';
const KEY = (() => {
  let k = '';
  try {
    const m = location.hash.match(/key=([^&]+)/);
    if (m) { localStorage.setItem('apiKey', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
    k = localStorage.getItem('apiKey') || '';
  } catch (e) {}
  return k;
})();
async function api(method, a) {
  const r = method === 'GET'
    ? await fetch(API + '?key=' + encodeURIComponent(KEY))
    : await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                         body: JSON.stringify({ key: KEY, a }) });
  const d = await r.json();
  if (d.error) throw new Error(d.error === 'bad key' ? 'this device has no key — open the setup link once' : d.error);
  return d.ok;
}

function load() {
  api('GET').then(d => { ingest(d); render(); })
    .catch(e => { $('#app').innerHTML = `<div class="empty">Couldn't load: ${esc(e.message)}</div>`; });
}

function ingest(d) {
  S.books = d.books.map(r => { const o = {}; d.keys.forEach((k, i) => o[k] = r[i]); return o; });
  S.byId = {}; S.books.forEach(b => S.byId[b.id] = b);
  S.state = {}; d.state.forEach(s => S.state[s.book_id] = s);
  S.ratings = {}; S.rhist = {};
  d.ratings.forEach(r => {
    const v = Number(r.Rating);
    if (!(v > 0)) return;
    S.ratings[r.book_id] = v;                          // last row wins (rereads replace)
    (S.rhist[r.book_id] = S.rhist[r.book_id] || []).push(r);
  });
  S.rebuilt = d.rebuilt;
  rescore();
}

function rescore() { S.books.forEach(b => b.s = score(b, S.state[b.id], S.ratings[b.id] ?? null)); }
function haveOf(b) {
  const v = (S.state[b.id] || {}).Have;
  return v ? (v === 'None' ? '' : v) : (b.have || '');
}
S.away = (() => { try { return localStorage.getItem('away') === '1'; } catch (e) { return false; } })();
const visible = () => S.books.filter(b => b.s.status !== 'finished' && !(S.away && haveOf(b) === 'Physical'));
const ranked = (arr, key) => arr.slice().sort((a, b) => b.s[key] - a.s[key] || b.s.rs - a.s.rs);   // ties -> Reading Score

let chain = Promise.resolve();
function send(a) {
  const b = S.byId[a.id];
  Object.assign(a, { title: b.title, author: b.author });
  chain = chain.then(() => api('POST', a)
    .then(row => { S.state[a.id] = row; rescore(); })
    .catch(e => { toast('Not saved: ' + e.message + ' — reloading'); load(); }));
  return chain;
}
function localState(id, patch) {
  S.state[id] = Object.assign({ book_id: id }, S.state[id] || {}, patch);
  rescore();
}

function toast(msg) {
  const t = $('#toast'); t.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.innerHTML = '', 2600);
}

function render() {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === S.tab));
  const v = { home: viewHome, flip: viewFlip, lists: viewLists }[S.tab]();
  $('#app').innerHTML = `<div class="topbar"><label class="sw${S.away ? ' on' : ''}"><input type="checkbox" id="away" ${S.away ? 'checked' : ''}>
      <span class="knob"></span>Away from my shelf <span class="sub">hides physical-only</span></label></div>` + v;
  document.body.classList.toggle('wide', S.tab === 'home');
  if ($('#modal').innerHTML && modal.book) { const y = $('.sheet').scrollTop; openBook(modal.book); $('.sheet').scrollTop = y; }
}

function controls(b, hl = () => '') {
  const s = b.s, id = b.id;
  if (s.status === 'finished') {
    return `<div class="ctls" data-ctl="${id}"><div class="sub" style="margin-top:10px">Finished · rated ${s.mine}★</div>
      <div class="row"><button class="grow" data-start="${id}">Start reread</button></div></div>`;
  }
  const pct = s.pagesRead / s.pages * 100, e = edition(b);
  const rv = s.sofar ?? Math.round(s.stars * 4) / 4;
  return `<div class="ctls" data-ctl="${id}">
    <div class="ctl">
      <label>Page</label>
      <div class="inl"><input type="number" class="pg-in" data-id="${id}" inputmode="numeric" min="0" max="${e.bp}"
        value="${e.page || ''}" placeholder="${e.ign ? e.ign : 0}"><span class="sub">of</span>
        <input type="number" class="ed bp-in${e.own ? '' : ' unset'}" data-id="${id}" inputmode="numeric" min="1"
          value="${e.bp}" title="Pages in your copy"><span class="pct">${pct < 10 && pct > 0 ? pct.toFixed(1) : Math.round(pct)}%</span></div>
      <div class="inl edr">Front pages not counted <input type="number" class="ig-in${e.ign ? '' : ' unset'}" data-id="${id}"
        inputmode="numeric" min="0" value="${e.ign || ''}" placeholder="0"></div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
    </div>
    <div class="ctl">
      <label>Rating so far <b class="rtv">${s.sofar !== null ? rv.toFixed(2) + ' ' + starStr(rv) : '—'}</b>
        <span class="sub">${s.mine !== null ? ' · rated ' + s.mine + ' before' : ' · model ' + f2(s.base)}</span></label>
      <input type="range" class="rt-in${s.sofar === null ? ' unset' : ''}" data-id="${id}" min="0.25" max="5" step="0.25" value="${rv}">
    </div>
    <div class="ctl">
      <label>Excitement</label>
      <div class="inl"><button class="sm" data-exc2="-1" data-id="${id}" ${s.exc <= 1 ? 'disabled' : ''}>−</button>
        <b class="excv${hl('exc')}">${s.exc}</b>
        <button class="sm" data-exc2="1" data-id="${id}" ${s.exc >= 10 ? 'disabled' : ''}>+</button></div>
    </div>
    ${rereadBox(b)}
    <div class="ctl">
      <label>Copy</label>
      <div class="seg have">${['None', 'Physical', 'Digital', 'Both'].map(v =>
        `<button data-have="${v}" data-id="${id}" class="${(haveOf(b) || 'None') === v ? 'on' : ''}">${v}</button>`).join('')}</div>
    </div>
    <div class="row fin">${S.finArm === id
      ? `<button class="grow" data-fincancel>Cancel</button><button class="primary grow" data-finok="${id}">Finish at ${rv}★</button>`
      : `<button class="grow" data-fin="${id}">Finished</button>`}</div>
  </div>`;
}

function infoBlock(b) {
  const s = b.s;
  const hist = (S.rhist[b.id] || []).map(r => `${starStr(Number(r.Rating))} ${r.Rating}${r['Date Finished'] ? ' · ' + esc(String(r['Date Finished']).slice(0, 10)) : ''}${r.Source === 'goodreads' ? ' · Goodreads' : ''}`).join('<br>');
  const e = edition(b);
  return `<div class="sub" style="margin-top:8px">Model stars ${f2(s.model)} · ${s.pages} pages${e.own || e.ign ? ` (your copy ${e.bp}${e.ign ? ', text starts after p. ' + e.ign : ''})` : ''}${b.words ? ' · ' + Number(b.words).toLocaleString() + ' words' : ''}</div>
    ${b.notes ? `<div class="notes">${esc(b.notes)}</div>` : ''}
    ${hist ? `<label>Your ratings</label><div class="hist">${hist}</div>` : ''}`;
}

function statRow(b, hl = () => '') {
  const s = b.s;
  return `<div class="stats">
      <div class="stat${hl('rs')}"><b>${fmtRS(s.rs)}</b><span>Score</span></div>
      <div class="stat${hl('stars')}"><b>${f2(s.stars)}</b><span>Stars</span></div>
      <div class="stat${hl('fv')}"><b>${f1(s.fv)}</b><span>Finish val</span></div>
      <div class="stat"><b>${f2(s.diff)}</b><span>Difficulty</span></div>
    </div>`;
}
const byline = b => `${esc(b.author)}${b.year ? ' · ' + b.year : ''}${b.form ? ' · ' + esc(b.form) : ''}`;

const CHAMP = { fv: 'Top Finish Value', rs: 'Top Reading Score', stars: 'Top Pred Stars', exc: 'Top Excitement' };
function bookCard(b, badges) {   // badges: champion keys (fv / rs / stars / exc)
  const hl = k => badges.includes(k) ? ' k-' + k : '';
  return `<div class="card hc k-${badges[0]}">
    <div class="stripe">${badges.map(k => `<i class="k-${k}"></i>`).join('')}</div>
    <div class="title" data-open="${b.id}">${esc(b.title)}</div>
    <div class="by">${byline(b)}</div>
    <div class="chips">${badges.map(k => `<span class="chip champ k-${k}">${CHAMP[k]}</span>`).join('')}${ij(b)}</div>
    ${statRow(b, hl)}
    ${controls(b, hl)}
  </div>`;
}

function rereadBox(b) {
  const s = b.s, pct = Math.round(s.reread * 100);
  return `<div class="rrbox" data-id="${b.id}">
    <label>Reread % <b class="rrv" style="color:var(--ink)">${pct}%</b></label>
    <input type="range" class="rr" min="0" max="100" step="5" value="${pct}">
    <div class="sub rrp"></div></div>`;   // filled while dragging
}

const isIJ = b => /wife 5★/.test(b.notes || '');
const ORIGINAL_51 = new Set([
  'bk_000006',   // Ulysses — James Joyce
  'bk_000281',   // Metamorphoses — Ovid
  'bk_000397',   // The Canterbury Tales — Geoffrey Chaucer
  'bk_000099',   // The Tale of Genji — Murasaki Shikibu
]);
const isO51 = b => ORIGINAL_51.has(b.id);
const ij = b => (isIJ(b) ? '<span class="chip ij">IJ</span>' : '') + (isO51(b) ? '<span class="chip o51">Original 51</span>' : '');

const isReread = b => b.s.mine !== null || /you've read it/.test(b.notes || '');

function viewHome() {
  const v = visible();
  if (!v.length) return '<div class="empty">No books.</div>';
  const cats = [['rs', v], ['fv', v], ['stars', v.filter(b => !isReread(b))], ['exc', v]];
  const cards = [];
  cats.forEach(([key, pool]) => {
    const b = ranked(pool, key)[0];
    if (!b) return;
    const c = cards.find(x => x.b === b);
    c ? c.badges.push(key) : cards.push({ b, badges: [key] });
  });
  return `<h1>Books</h1><div class="sub">${S.rebuilt ? 'Models rebuilt ' + esc(S.rebuilt) : ''}</div>
    <div class="cards" style="--n:${cards.length}">${cards.map(c => bookCard(c.b, c.badges)).join('')}</div>`;
}

const LISTS = { rs: ['Score', 'rs', fmtRS], stars: ['Stars', 'stars', f2], fv: ['Finish val', 'fv', f1], exc: ['Excite', 'exc', x => x] };
function viewLists() {
  const seg = Object.entries(LISTS).map(([k, [lab]]) => `<button data-list="${k}" class="${S.list === k ? 'on' : ''}">${lab}</button>`).join('');
  let rows, [, key, fmt] = LISTS[S.list];
  if (S.q.trim()) {
    const q = S.q.trim().toLowerCase();
    rows = ranked(S.books.filter(b => (b.title + ' ' + b.author).toLowerCase().includes(q)), key).slice(0, 50);
  } else {
    const v = visible();
    rows = ranked(v, key).slice(0, 50);
  }
  const li = rows.map((b, i) => { const H = b.s.status === 'finished' ? null : hoursUI(b); return `<div class="li${S.open === b.id ? ' open' : ''}" data-expand="${b.id}">
      <div class="n">${i + 1}</div>
      <div class="t"><div>${isIJ(b) ? '<span class="ijm">IJ</span>' : ''}${isO51(b) ? '<span class="ijm o51">Original 51</span>' : ''}${esc(b.title)}</div>
        <div>${esc(b.author)} · ${b.s.status === 'finished' ? 'finished ' + starStr(b.s.mine) : b.s.pagesRead > 0 ? `p. ${edition(b).page}/${edition(b).bp} · ${Math.round(b.s.pagesRead / b.s.pages * 100)}%` : esc(b.status || '')}${haveOf(b) ? ' · ' + haveOf(b).toLowerCase() : ''}${H ? ' · ' + H.txt : ''}</div></div>
      <div class="v">${fmt(b.s[key])}</div>${H ? H.bar : ''}</div>
    ${S.open === b.id ? `<div class="li-x"><div class="by">${byline(b)}</div><div class="chips">${ij(b)}</div>
      ${statRow(b)}${infoBlock(b)}${controls(b)}</div>` : ''}`; }).join('');
  return `<h1>Lists</h1>
    <input type="search" id="q" placeholder="Search all books" value="${esc(S.q)}">
    <div class="seg">${seg}</div>
    <div class="list">${li || '<div class="empty">Nothing matches.</div>'}</div>`;
}

function startFlip() {
  const order = ranked(visible(), 'rs').map(b => b.id);
  S.flip = { order, i: 0, session: 'f' + Date.now().toString(36), undo: [], picked: null };
}
function viewFlip() {
  if (!S.flip) startFlip();
  const F = S.flip;
  if (F.picked) {
    const b = S.byId[F.picked];
    return `<h1>Flip</h1><div class="card flip"><div class="sub">You picked</div>
      <div class="title">${esc(b.title)}</div><div class="by">${esc(b.author)}</div>
      <div class="sub" style="margin-top:10px">Excitement now ${b.s.exc}.</div>
      <div class="row"><button class="grow" data-undo>Undo</button><button class="primary grow" data-home>Done</button></div></div>`;
  }
  const id = F.order[F.i];
  if (!id) return `<h1>Flip</h1><div class="empty">End of the list.</div>
    <div class="row"><button class="grow" data-undo ${F.undo.length ? '' : 'disabled'}>Undo</button><button class="grow" data-restart>Start over</button></div>`;
  const b = S.byId[id], s = b.s;
  return `<h1>Flip</h1><div class="sub">#${F.i + 1} by Reading Score${F.i ? ` · skipped ${F.i}` : ''}</div>
    <div class="card flip">
      <div class="title">${esc(b.title)}</div>
      <div class="by">${esc(b.author)}${b.year ? ' · ' + b.year : ''}${b.form ? ' · ' + esc(b.form) : ''}</div>
      <div class="chips"><span class="chip">${esc(b.status || '')}</span>${ij(b)}</div>
      ${statRow(b)}
      ${b.notes ? `<div class="notes">${esc(b.notes)}</div>` : ''}
      ${controls(b)}
    </div>
    <div class="row">
      <button class="grow" data-skip>Not now <span class="sub">${s.exc > 1 ? '−1' : 'stays 1'}</span></button>
      <button class="primary grow" data-pick>Read this <span>${s.exc < 10 ? '+1' : 'stays 10'}</span></button>
    </div>
    <div class="row"><button class="grow" data-undo ${F.undo.length ? '' : 'disabled'}>Undo</button></div>`;
}
function flipAct(type) {
  const F = S.flip, id = F.order[F.i], b = S.byId[id];
  const prev = { id, exc: b.s.exc, status: b.s.status, stateRow: S.state[id] ? Object.assign({}, S.state[id]) : null };
  F.undo.push(prev);
  const exc = type === 'skip' ? Math.max(1, b.s.exc - 1) : Math.min(10, b.s.exc + 1);
  const patch = { Excitement: exc };
  if (type === 'pick') { patch.Status = 'started'; F.picked = id; } else F.i++;
  localState(id, patch);
  send({ type, id, excBefore: prev.exc, session: F.session });
  render();
}
function flipUndo() {
  const F = S.flip, u = F.undo.pop();
  if (!u) return;
  if (F.picked) F.picked = null; else F.i--;
  if (u.stateRow) S.state[u.id] = u.stateRow; else delete S.state[u.id];
  rescore();
  send({ type: 'undo', id: u.id, excitement: u.exc, status: u.status, session: F.session });
  render();
}

function closeModal() { $('#modal').innerHTML = ''; modal.book = null; }
function modal(html) { $('#modal').innerHTML = `<div class="sheet-bg" data-close><div class="sheet">${html}</div></div>`; }

function openBook(id) {
  const b = S.byId[id];
  modal(`<div class="title">${esc(b.title)}</div>
    <div class="by">${byline(b)}</div>
    <div class="chips"><span class="chip">${b.s.status === 'finished' ? 'Finished' : esc(b.status || '')}</span>${ij(b)}</div>
    ${statRow(b)}${infoBlock(b)}${controls(b)}
    <div class="row"><button class="grow" data-close-btn>Close</button></div>`);
  modal.book = id;
}

document.addEventListener('click', e => {
  if (e.target.closest('input')) return;
  const t = e.target.closest('button, [data-open], [data-expand], [data-close]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; if (d.tab === 'flip' && S.flip && (S.flip.picked || !S.flip.order[S.flip.i])) S.flip = null; render(); window.scrollTo(0, 0); }
  else if (d.list) { S.list = d.list; render(); }
  else if (d.open) openBook(d.open);
  else if (d.expand) { S.open = S.open === d.expand ? null : d.expand; S.finArm = null; render(); }
  else if (d.skip !== undefined) flipAct('skip');
  else if (d.pick !== undefined) flipAct('pick');
  else if (d.undo !== undefined) flipUndo();
  else if (d.restart !== undefined) { S.flip = null; render(); }
  else if (d.home !== undefined) { S.flip = null; S.tab = 'home'; render(); }
  else if (d.have) {
    localState(d.id, { Have: d.have }); send({ type: 'have', id: d.id, have: d.have }); render();
  }
  else if (d.exc2) {
    const id = d.id, before = S.byId[id].s.exc, v = Math.max(1, Math.min(10, before + Number(d.exc2)));
    localState(id, { Excitement: v }); send({ type: 'excitement', id, excitement: v, excBefore: before }); render();
  }
  else if (d.fin) { S.finArm = d.fin; render(); }
  else if (d.fincancel !== undefined) { S.finArm = null; render(); }
  else if (d.finok) {
    const id = d.finok, b = S.byId[id], rating = b.s.sofar ?? Math.round(b.s.stars * 4) / 4;
    S.finArm = null;
    const fe = edition(b);
    localState(id, { Status: 'finished', 'Pages Read': 0, Page: '', 'Rating So Far': '' });
    S.ratings[id] = rating;
    (S.rhist[id] = S.rhist[id] || []).push({ Rating: rating, 'Date Finished': 'today', Source: 'app' });
    rescore(); send({ type: 'finish', id, page: fe.bp, rating }); render();
    toast(`${b.title}: ${rating}★ saved — Pred Stars retrains tonight`);
  }
  else if (d.start) {
    const id = d.start, prev = S.byId[id].s.status;
    localState(id, prev === 'finished' ? { Status: 'started', 'Pages Read': 0, Page: '', 'Rating So Far': '' } : { Status: 'started' });
    send({ type: 'start', id }); render(); toast('Reread started');
  }
  else if (d.closeBtn !== undefined || (d.close !== undefined && e.target === t)) closeModal();
});
document.addEventListener('keydown', e => {   // Enter in the page box commits it
  if (e.key === 'Enter' && e.target.matches('.pg-in, .bp-in, .ig-in')) e.target.blur();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  else if (e.target.classList.contains('rt-in')) {
    const r = Number(e.target.value);
    e.target.closest('.ctl').querySelector('.rtv').textContent = r.toFixed(2) + ' ' + starStr(r);
    e.target.classList.remove('unset');
  }
  else if (e.target.classList.contains('rr')) {
    const box = e.target.closest('.rrbox'), id = box.dataset.id, b = S.byId[id], v = Number(e.target.value) / 100;
    const s = score(b, Object.assign({}, S.state[id] || {}, { 'Reread %': v }), S.ratings[id] ?? null);
    box.querySelector('.rrv').textContent = Math.round(v * 100) + '%';
    box.querySelector('.rrp').textContent = `Finish value ${f1(s.fv)} · stars ${f2(s.stars)} · score ${fmtRS(s.rs)}`;
  }
});
document.addEventListener('change', e => {   // slider released / page committed -> save
  if (e.target.id === 'away') {
    S.away = e.target.checked; S.flip = null; S.finArm = null;
    try { localStorage.setItem('away', S.away ? '1' : '0'); } catch (err) { /* private window: just this session */ }
    render(); return;
  }
  if (e.target.matches('.bp-in, .ig-in')) {      // your copy's page count / front pages not counted
    const id = e.target.dataset.id, b = S.byId[id], box = e.target.closest('.ctls'), e0 = edition(b);
    const bv = Math.round(Number(box.querySelector('.bp-in').value) || 0);
    const bookPages = bv > 0 && bv !== b.s.pages ? bv : '';      // same as Books v2 Pages -> nothing to store
    const ignore = Math.max(0, Math.round(Number(box.querySelector('.ig-in').value) || 0));
    const patch = { 'Book Pages': bookPages, 'Ignore Pages': ignore || '' };
    if (e0.page > 0) {       // you're still on the same page of the book; only the % changes
      patch.Page = e0.page;
      patch['Pages Read'] = pagesReadFor(edition(b, Object.assign({}, S.state[id] || {}, patch)), e0.page);
    }
    localState(id, patch);
    send({ type: 'edition', id, bookPages, ignore, canon: b.s.pages }); render();
    const e1 = edition(b);
    toast(`Your copy: ${e1.bp} pages${e1.ign ? `, counting from p. ${e1.ign + 1}` : ''}`);
    return;
  }
  if (e.target.classList.contains('pg-in') || e.target.classList.contains('rt-in')) {
    const id = e.target.dataset.id, b = S.byId[id], ed = edition(b);
    const box = e.target.closest('.ctls');
    const page = Math.max(0, Math.min(Math.round(Number(box.querySelector('.pg-in').value) || 0), ed.bp));
    const rating = e.target.classList.contains('rt-in') ? Number(e.target.value) : b.s.sofar;
    localState(id, { Status: 'started', Page: page, 'Pages Read': pagesReadFor(ed, page), 'Rating So Far': rating ?? '' });
    send({ type: 'progress', id, page, canon: b.s.pages, rating }); render(); toast('Saved');
    return;
  }
  if (!e.target.classList.contains('rr')) return;
  const id = e.target.closest('.rrbox').dataset.id, v = Number(e.target.value) / 100;
  localState(id, { 'Reread %': v });
  send({ type: 'reread', id, reread: v }); render(); toast(`Reread ${Math.round(v * 100)}% saved — list re-ranked`);
});

load();
</script>
</body>
</html>
